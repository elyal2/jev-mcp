[project]
name = "jev-mcp"
version = "0.1.0"
description = "MCP server for the TypeSafe Decision API (System One / Jev): typed Choice/Score/Noul judgments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.scripts]
jev-mcp = "jev_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_mcp"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated tests (default)",
    "integration: slower tests that may hit real I/O boundaries",
]
addopts = "--cov=jev_mcp --cov-report=term-missing"

[tool.coverage.run]
source = ["jev_mcp"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
]
