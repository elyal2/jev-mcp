services:
  jev-mcp:
    build: .
    container_name: jev-mcp
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      JEV_TRANSPORT: streamable-http
      JEV_HTTP_HOST: 0.0.0.0
      JEV_HTTP_PORT: "8787"
      JEV_BASE_URL: ${JEV_BASE_URL:-https://api.typesafe.ai/v1/systemone}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      JEV_API_KEY: ${JEV_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    env_file:
      - .env
